[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
# ${VAR:default} — uses FUJI_RPC_URL from the environment when set,
# otherwise falls back to the public Fuji RPC. No env var required to deploy.
fuji = "${FUJI_RPC_URL:https://api.avax-test.network/ext/bc/C/rpc}"

[etherscan]
avalanche_fuji = { key = "${SNOWTRACE_API_KEY}", chain = 43113 }
