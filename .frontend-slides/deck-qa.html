<!doctype html><html><meta charset="utf-8"><title>Presentation QA</title><style>body{font:16px sans-serif;background:#ddd;margin:20px}#grid{display:grid;grid-template-columns:576px 576px;gap:20px}iframe{width:576px;height:324px;border:0}#result{white-space:pre-wrap}h1{font-size:20px}</style><h1>Presentation layout verification</h1><pre id="result">Running…</pre><div id="grid"></div><script>
const page=Number(new URLSearchParams(location.search).get('page')||0);
const audit=new URLSearchParams(location.search).has('audit');
const grid=document.getElementById('grid');
async function frame(index){const f=document.createElement('iframe');f.src='index.html#'+(index+1);grid.append(f);await new Promise(r=>f.onload=r);const w=f.contentWindow;await w.document.fonts.ready;w.document.querySelector('.deck-controls').style.display='none';w.document.querySelector('.deck-viewport').style.bottom='0';w.presentation.fit();w.presentation.go(index,true);return w;}
(async()=>{if(!audit){for(let i=page*6;i<Math.min(page*6+6,44);i++)await frame(i);document.getElementById('result').textContent='Slides '+(page*6+1)+'–'+Math.min(page*6+6,44);return;}
const w=await frame(0), p=w.presentation, issues=[],results=[];
for(let i=0;i<p.slides.length;i++){p.go(i,true);await new Promise(r=>setTimeout(r,30));const slide=p.slides[i],content=slide.querySelector('.slide-content').getBoundingClientRect(),footer=slide.querySelector('footer')?.getBoundingClientRect();for(const el of slide.querySelectorAll('[data-edit]')){const r=el.getBoundingClientRect();if(r.right>content.right+2||r.left<content.left-2||r.bottom>(footer?.top||content.bottom)+2)issues.push(`${i+1}: bounds: ${el.textContent.slice(0,50)}`);if(el.scrollWidth>el.clientWidth+2||el.scrollHeight>el.clientHeight+2)issues.push(`${i+1}: text overflow: ${el.textContent.slice(0,50)}`);}const blocks=[...slide.querySelectorAll('.slide-content>h2,.slide-content>.subtitle,.slide-content>.steps,.slide-content>.rows,.slide-content>.split,.slide-content>.metrics,.slide-content>.reference-rows,.slide-content>.nft-row,.slide-content>.commands,.slide-content>.product-layout')];for(let a=0;a<blocks.length;a++)for(let b=a+1;b<blocks.length;b++){const x=blocks[a].getBoundingClientRect(),y=blocks[b].getBoundingClientRect();if(Math.min(x.right,y.right)-Math.max(x.left,y.left)>2&&Math.min(x.bottom,y.bottom)-Math.max(x.top,y.top)>2)issues.push(`${i+1}: overlapping major blocks`);}}
const check=(name,value)=>results.push((value?'PASS ':'FAIL ')+name);
p.go(4);check('flow starts at step zero',p.step===0);p.next();check('next reveals a step',p.step===1&&p.index===4);p.previous();check('previous reverses a step',p.step===0&&p.index===4);p.previous();check('previous slide shows complete state',p.index===3&&p.step===p.maxStep());p.go(0);p.previous();check('first-slide boundary',p.index===0&&p.step===0);p.go(43,true);p.next();check('last-slide boundary',p.index===43);p.go(19);check('hash navigation',w.location.hash==='#20');p.toggleNotes();check('notes visible',!w.document.querySelector('#notes').hidden);p.toggleNotes();p.toggleEdit();check('edit enabled',w.document.querySelector('[data-edit]').isContentEditable);p.toggleEdit();check('edit disabled',!w.document.querySelector('[data-edit]').isContentEditable);check('single active slide',w.document.querySelectorAll('.slide.active').length===1);check('inactive slides inert',p.slides.filter((s,i)=>i!==p.index).every(s=>s.inert));check('no remote font/image/script assets',[...w.document.querySelectorAll('img[src],script[src],link[rel=stylesheet]')].every(e=>(e.src||e.href).startsWith('data:')));
p.go(4);w.document.querySelector('#next').focus();w.document.querySelector('#next').dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));check('keyboard after a control click',p.step===1);
const f=w.frameElement;for(const [width,height] of [[1280,720],[390,844]]){f.style.width=width+'px';f.style.height=height+'px';p.fit();const r=w.document.querySelector('.deck-stage').getBoundingClientRect();check('16:9 stage fits '+width+'x'+height,Math.abs(r.width/r.height-16/9)<.001&&r.left>=-.1&&r.top>=-.1&&r.right<=width+.1&&r.bottom<=height+.1);}
let exported;w.URL.createObjectURL=blob=>{exported=blob;return 'blob:qa-test'};w.URL.revokeObjectURL=()=>{};w.HTMLAnchorElement.prototype.click=function(){};p.exportFile();const exportedText=await exported.text();check('export creates portable HTML',exportedText.startsWith('<!doctype html>')&&exportedText.includes('data:font/ttf;base64,')&&!exportedText.includes('contenteditable='));
document.getElementById('result').textContent=JSON.stringify({slides:p.slides.length,layoutIssues:issues,behavior:results},null,2);
})();</script></html>
